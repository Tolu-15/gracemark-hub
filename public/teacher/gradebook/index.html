<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Score Entry Module — Gracemark V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/portal-layout.css" />
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
        }

        /* Hide number arrows */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .score-input {
            width: 44px;
            text-align: center;
            padding: 6px 4px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 0.875rem;
            transition: all 0.2s;
            outline: none;
        }

        .score-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .score-input:disabled {
            background-color: #f1f5f9;
            color: #94a3b8;
            cursor: not-allowed;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 h-screen h-[100dvh] flex flex-col overflow-hidden">

    <!-- Top Header -->
    <header
        class="portal-page-header portal-header bg-white border-b border-slate-200 shadow-sm z-20 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 shrink-0">
        <div class="min-w-0">
            <a href="/teacher/dashboard/" class="inline-flex items-center gap-1 text-sm text-slate-600 hover:text-slate-900 mb-2">
                ← Dashboard
            </a>
            <h1 class="text-lg sm:text-xl font-bold text-slate-900">Score Entry Module</h1>
            <p class="text-xs sm:text-sm text-slate-500 mt-0.5">Enter scores. Blanks are ignored. Zeros must be typed.</p>
        </div>
        <div class="portal-header-actions flex flex-wrap gap-3 w-full sm:w-auto">
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Class</label>
                <select id="classSelect"
                    class="w-32 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500">
                    <option value="JSS1">JSS 1</option>
                    <option value="JSS2">JSS 2</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Subject</label>
                <select id="subjectSelect"
                    class="w-48 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500">
                    <option value="Mathematics">Mathematics</option>
                    <option value="English">English Language</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Main Data Grid -->
    <main class="flex-1 overflow-auto p-3 sm:p-4 lg:p-8 relative">
        <div class="portal-table-wrap inline-block min-w-full bg-white rounded-xl shadow-sm border border-slate-200">
            <table class="w-full text-left text-sm whitespace-nowrap">
                <thead class="bg-slate-50 text-slate-700 border-b border-slate-200 sticky top-0 z-10">
                    <tr>
                        <th class="px-6 py-4 font-semibold sticky left-0 bg-slate-50 border-r border-slate-200 z-20 shadow-[1px_0_0_#e2e8f0]">
                            Student</th>
                        <th class="px-4 py-4 font-semibold text-center">CW (0–10)</th>
                        <th class="px-4 py-4 font-semibold text-center">HW (0–5)</th>
                        <th class="px-4 py-4 font-semibold text-center">Tests (0–10)</th>
                        <th class="px-4 py-4 font-semibold text-center">Project (0–5)</th>
                        <th class="px-4 py-4 font-semibold text-center">Exam (0–70)</th>
                        <th class="px-4 py-4 font-semibold text-center">CA</th>
                        <th class="px-4 py-4 font-semibold text-center">Total</th>
                        <th class="px-4 py-4 font-semibold text-center">Grade</th>
                        <th class="px-4 py-4 font-semibold text-center">Status</th>
                    </tr>
                </thead>
                <tbody id="scoreTableBody" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </main>

    <!-- Floating Action Bar -->
    <footer
        class="bg-white border-t border-slate-200 px-8 py-4 flex justify-between items-center shrink-0 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
        <div class="text-sm text-slate-500">
            <span id="saveStatus" class="font-medium text-slate-700">All changes up to date</span>
        </div>
        <div class="flex gap-3">
            <button id="btnSaveDraft"
                class="px-6 py-2.5 border border-slate-300 text-slate-700 font-semibold rounded-lg hover:bg-slate-50 transition-colors shadow-sm">
                Save Draft
            </button>
            <button id="btnPublish"
                class="px-6 py-2.5 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition-colors shadow-sm flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
                Publish to Admin
            </button>
        </div>
    </footer>

    <!-- Cloneable Row Template (Hidden) -->
    <template id="rowTemplate">
        <!-- JS will populate the exact structure to maintain clean scaling -->
    </template>

    <script type="module" src="/js/teacher/gradebook.js"></script>
    <link rel="stylesheet" href="/assets/powered-by.css" />
    <script type="module" src="/js/shared/poweredBy.js"></script>
</body>

</html>
