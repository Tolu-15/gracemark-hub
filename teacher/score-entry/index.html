<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Entry Module — Gracemark V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/score-entry.css" />
    <link rel="stylesheet" href="/assets/powered-by.css" />
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
        }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden">

    <header class="score-entry-header bg-white border-b border-slate-200 shadow-sm z-20 shrink-0">
        <div class="flex flex-col gap-3 md:flex-row md:items-start md:justify-between">
            <div class="flex items-start gap-3 min-w-0">
                <a href="/teacher/dashboard/"
                    class="shrink-0 inline-flex items-center gap-1.5 px-3 py-2 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors"
                    aria-label="Back to dashboard">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                    Back
                </a>
                <div class="min-w-0">
                    <h1 class="text-lg md:text-xl font-bold text-slate-900 leading-tight">Score Entry</h1>
                    <p class="text-xs md:text-sm text-slate-500 mt-0.5 hidden sm:block">
                        CW /10 · Asg /5 · Tests /10 · Project /5 · Exam /70
                    </p>
                </div>
            </div>
            <div class="flex flex-wrap gap-2 md:gap-3 items-end">
                <div class="px-2.5 py-1.5 bg-blue-50 border border-blue-100 rounded-lg">
                    <span class="block text-[10px] font-bold text-blue-600 uppercase tracking-wide">Term</span>
                    <span id="displayTerm" class="text-xs md:text-sm font-bold text-blue-900">—</span>
                </div>
                <div>
                    <label class="block text-[10px] font-semibold text-slate-500 uppercase mb-0.5">Class</label>
                    <select id="classSelect"
                        class="w-full min-w-[7rem] px-2.5 py-1.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500"></select>
                </div>
                <div>
                    <label class="block text-[10px] font-semibold text-slate-500 uppercase mb-0.5">Subject</label>
                    <select id="subjectSelect"
                        class="w-full min-w-[9rem] px-2.5 py-1.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500"></select>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-auto p-3 md:p-4">
        <p class="score-scroll-hint">Swipe left/right to see all score columns →</p>

        <div id="scoreCardsMobile" class="score-cards-mobile space-y-3"></div>

        <div class="score-table-desktop bg-white rounded-xl shadow-sm border border-slate-200 score-table-wrap">
            <table class="score-table">
                <thead class="bg-slate-50 text-slate-700 border-b border-slate-200 sticky top-0 z-10">
                    <tr>
                        <th rowspan="2" class="score-cell score-cell--index sticky-col sticky-col--index">#</th>
                        <th rowspan="2" class="score-cell score-cell--student sticky-col sticky-col--student">Student</th>
                        <th colspan="5" class="border-l border-slate-200">CW</th>
                        <th colspan="5" class="border-l border-slate-200">Asg</th>
                        <th colspan="3" class="border-l border-slate-200">Tests</th>
                        <th rowspan="2" class="score-cell score-cell--input border-l border-slate-200">Prj</th>
                        <th rowspan="2" class="score-cell score-cell--input border-l border-slate-200">Exm</th>
                        <th rowspan="2" class="score-cell score-cell--computed border-l border-slate-200">CW</th>
                        <th rowspan="2" class="score-cell score-cell--computed">Asg</th>
                        <th rowspan="2" class="score-cell score-cell--computed">Tst</th>
                        <th rowspan="2" class="score-cell score-cell--computed">CA</th>
                        <th rowspan="2" class="score-cell score-cell--total">Tot</th>
                        <th rowspan="2" class="score-cell score-cell--grade">Gr</th>
                        <th rowspan="2" class="score-cell score-cell--status">St</th>
                    </tr>
                    <tr>
                        <th class="score-cell score-cell--input border-l border-slate-200">1</th>
                        <th class="score-cell score-cell--input">2</th>
                        <th class="score-cell score-cell--input">3</th>
                        <th class="score-cell score-cell--input">4</th>
                        <th class="score-cell score-cell--input">5</th>
                        <th class="score-cell score-cell--input border-l border-slate-200">1</th>
                        <th class="score-cell score-cell--input">2</th>
                        <th class="score-cell score-cell--input">3</th>
                        <th class="score-cell score-cell--input">4</th>
                        <th class="score-cell score-cell--input">5</th>
                        <th class="score-cell score-cell--input border-l border-slate-200">15</th>
                        <th class="score-cell score-cell--input">15</th>
                        <th class="score-cell score-cell--input">30</th>
                    </tr>
                </thead>
                <tbody id="scoreTableBody" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </main>

    <footer
        class="score-action-footer bg-white border-t border-slate-200 flex justify-between items-center shrink-0 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
        <div class="text-xs md:text-sm text-slate-500 min-w-0">
            <span id="saveStatus" class="font-medium text-slate-700">All changes up to date</span>
        </div>
        <div class="flex gap-2 shrink-0">
            <button id="btnSaveDraft"
                class="px-3 md:px-5 py-2 border border-slate-300 text-slate-700 text-sm font-semibold rounded-lg hover:bg-slate-50 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                Save Draft
            </button>
            <button id="btnPublish"
                class="px-3 md:px-5 py-2 bg-blue-600 text-white text-sm font-semibold rounded-lg hover:bg-blue-700 transition-colors flex items-center gap-1.5 disabled:opacity-50 disabled:cursor-not-allowed">
                <svg class="w-4 h-4 hidden sm:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
                Publish
            </button>
        </div>
    </footer>

    <script type="module" src="/js/teacher/score-entry.js"></script>
    <script type="module" src="/js/shared/poweredBy.js"></script>
</body>

</html>
