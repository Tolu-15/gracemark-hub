<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Gracemark" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />
  <title>Gracemark Academy — Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/assets/style.css" />
  <link rel="stylesheet" href="/assets/portal-layout.css" />
  <link rel="stylesheet" href="/assets/pwa-install.css" />

  <style>
    :root {
      --ink: #f1f5f9;
      --slate: #94a3b8;
      --gold: #c9a84c;
      --gold-lt: #e8c97a;
      --cream: #020617;
      --muted: #64748b;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      position: relative;
      overflow-x: hidden;
      min-height: 100dvh;
    }

    /* ── Decorative background ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 15% 10%, rgba(148, 163, 184, .05) 0%, transparent 65%),
        radial-gradient(ellipse 60% 50% at 88% 85%, rgba(201, 168, 76, .08) 0%, transparent 60%);
      pointer-events: none;
    }

    /* Grid dot texture */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, rgba(148, 163, 184, .08) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
    }

    /* ── Card ── */
    .card {
      position: relative;
      background: #0f172a;
      border: 1px solid rgba(148, 163, 184, .10);
      border-radius: 20px;
      box-shadow:
        0 4px 24px rgba(0, 0, 0, .2),
        0 16px 48px rgba(0, 0, 0, .4);
      width: 100%;
      max-width: 440px;
      padding: 52px 48px 44px;
      animation: riseIn .55s cubic-bezier(.22, .68, 0, 1.2) both;
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(28px) scale(.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Gold rule accent */
    .gold-rule {
      width: 48px;
      height: 3px;
      background: linear-gradient(90deg, var(--gold), var(--gold-lt));
      border-radius: 2px;
      margin: 0 auto 28px;
    }

    /* ── Logo / Crest ── */
    .crest {
      width: 60px;
      height: 60px;
      margin: 0 auto 16px;
      background: linear-gradient(145deg, #1e293b, #020617);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .35);
    }

    .crest svg {
      width: 30px;
      height: 30px;
    }

    /* ── Typography ── */
    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.75rem;
      color: var(--ink);
      text-align: center;
      letter-spacing: -.02em;
      line-height: 1.15;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      font-size: .875rem;
      color: var(--muted);
      font-weight: 300;
      margin-bottom: 36px;
    }

    /* ── Form elements ── */
    .field-label {
      display: block;
      font-size: .78rem;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--slate);
      margin-bottom: 7px;
    }

    .field-wrap {
      position: relative;
      margin-bottom: 20px;
    }

    .field-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      pointer-events: none;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border: 1.5px solid #334155;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: .925rem;
      color: var(--ink);
      background: #1e293b;
      transition: border-color .2s, box-shadow .2s, background .2s;
      outline: none;
    }

    input:focus {
      border-color: var(--gold);
      background: #0f172a;
      box-shadow: 0 0 0 3px rgba(201, 168, 76, .15);
    }

    input::placeholder {
      color: #64748b;
    }

    /* Password toggle */
    .pwd-toggle {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      padding: 4px;
      transition: color .15s;
    }

    .pwd-toggle:hover {
      color: var(--slate);
    }

    /* Forgot password */
    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin-top: -10px;
      margin-bottom: 28px;
    }

    .forgot-link {
      font-size: .82rem;
      color: var(--slate);
      text-decoration: none;
      font-weight: 500;
      opacity: .75;
      transition: opacity .15s;
    }

    .forgot-link:hover {
      opacity: 1;
      text-decoration: underline;
    }

    /* ── Sign In Button ── */
    #signInBtn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #334155 0%, #0f172a 100%);
      border: 1px solid #475569;
      color: #fff;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: .95rem;
      font-weight: 600;
      letter-spacing: .03em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: opacity .2s, transform .15s, box-shadow .2s;
      box-shadow: 0 4px 16px rgba(26, 26, 46, .25);
      position: relative;
      overflow: hidden;
    }

    #signInBtn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(201, 168, 76, .18), transparent);
      opacity: 0;
      transition: opacity .2s;
    }

    #signInBtn:hover:not(:disabled)::before {
      opacity: 1;
    }

    #signInBtn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(26, 26, 46, .32);
    }

    #signInBtn:active:not(:disabled) {
      transform: translateY(0);
    }

    #signInBtn:disabled {
      opacity: .7;
      cursor: not-allowed;
    }

    /* Spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, .35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ── Error alert ── */
    #errorAlert {
      display: none;
      margin-top: 18px;
      padding: 11px 15px;
      background: rgba(220, 38, 38, .1);
      border: 1px solid rgba(220, 38, 38, .2);
      border-left: 3px solid var(--error);
      border-radius: 8px;
      font-size: .86rem;
      color: #fca5a5;
      font-weight: 500;
      animation: shakeIn .35s ease;
    }

    @keyframes shakeIn {
      0% {
        transform: translateX(-6px);
        opacity: 0;
      }

      40% {
        transform: translateX(5px);
      }

      70% {
        transform: translateX(-3px);
      }

      100% {
        transform: translateX(0);
        opacity: 1;
      }
    }

    #errorAlert.show {
      display: flex;
      align-items: flex-start;
      gap: 9px;
    }

    /* ── Divider & footer ── */
    .card-footer {
      margin-top: 36px;
      padding-top: 20px;
      border-top: 1px solid rgba(148, 163, 184, .10);
      text-align: center;
    }

    .disclaimer {
      font-size: .76rem;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #b0aaa0;
    }

    .disclaimer span {
      color: var(--gold);
    }

    @media (max-width: 480px) {
      .card {
        padding: 40px 28px 36px;
        margin: 16px;
      }
    }
  </style>
</head>

<body class="login-page bg-slate-950 text-slate-100">

  <main class="max-w-5xl mx-auto w-full min-h-screen flex items-center justify-center p-4">
    <div class="card">

      <!-- Crest icon -->
      <div class="crest">
        <svg viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 3L4 8.5V15C4 20.25 8.88 25.17 15 27C21.12 25.17 26 20.25 26 15V8.5L15 3Z" fill="none"
            stroke="#c9a84c" stroke-width="1.6" stroke-linejoin="round" />
          <path d="M11 15.5l2.5 2.5L19 12" stroke="#c9a84c" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </div>

      <h1>Welcome Back</h1>
      <p class="subtitle">Sign in to your academy portal</p>
      <div class="gold-rule"></div>

      <form id="loginForm" novalidate>

        <!-- Email -->
        <div class="field-wrap">
          <label class="field-label" for="email">Email or Admission No.</label>
          <div style="position:relative;">
            <span class="field-icon">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M3 8l9 6 9-6M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
            </span>
            <input type="text" id="email" name="email" placeholder="e.g. you@email.com or GMA1234"
              autocomplete="username" required />
          </div>
        </div>

        <!-- Password -->
        <div class="field-wrap">
          <label class="field-label" for="password">Password</label>
          <div style="position:relative;">
            <span class="field-icon">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </span>
            <input type="password" id="password" name="password" placeholder="••••••••••••"
              autocomplete="current-password" required />
            <button type="button" class="pwd-toggle" id="togglePwd" aria-label="Show password">
              <!-- Eye icon — swapped by JS -->
              <svg id="eyeIcon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Forgot password -->
        <div class="forgot-row">
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <!-- Submit -->
        <button type="submit" id="signInBtn">
          <span class="spinner" id="spinner"></span>
          <span id="btnText">Sign In</span>
          <svg id="btnArrow" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6" />
          </svg>
        </button>

        <!-- Error alert -->
        <div id="errorAlert" role="alert">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
            style="flex-shrink:0;margin-top:1px">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
          </svg>
          <span id="errorMsg">Invalid email or password. Please try again.</span>
        </div>

      </form>

      <div class="card-footer">
        <p class="disclaimer">Gracemark Academy &nbsp;<span>✦</span>&nbsp; Result Hub <span>V2</span></p>
      </div>

    </div>
  </main>

  <!-- Firebase v9 via CDN (compat shim for module-like usage in plain HTML) -->
  <!-- NOTE: For production, use a bundler (Vite/Webpack) with true ESM imports -->
  <script type="module" src="/js/student/login.js"></script>
  <link rel="stylesheet" href="/assets/powered-by.css" />
  <script type="module" src="/js/shared/poweredBy.js"></script>

</body>

</html>
