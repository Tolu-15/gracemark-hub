<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Students — Gracemark Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- SheetJS for Excel Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0f172a;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
    <link rel="stylesheet" href="/assets/portal-layout.css" />
</head>

<body class="bg-slate-50 text-slate-800 portal-app flex min-h-[100dvh] overflow-hidden">

    <div id="portalNavBackdrop" class="portal-nav-backdrop" hidden></div>

    <div id="authLoader" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center">
        <div class="loader mb-4"></div>
        <p class="text-sm font-medium text-slate-500 animate-pulse">Verifying access...</p>
    </div>

    <!-- Sidebar -->
    <aside id="portalSidebar" class="portal-sidebar w-64 bg-slate-950 text-slate-300 flex flex-col ">
        <div class="p-6 border-b border-slate-800 flex items-center justify-between gap-2">
            <div class="portal-sidebar-brand flex items-center gap-3 min-w-0">
                <div
                    class="w-8 h-8 rounded bg-gradient-to-br from-yellow-500 to-yellow-600 flex items-center justify-center shadow-lg">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 14l9-5-9-5-9 5 9 5z"></path>
                    </svg>
                </div>
                <h2 class="text-lg font-bold text-white tracking-tight">Gracemark <span
                        class="text-xs text-yellow-500 align-top">V2</span></h2>
            </div>
        </div>

        <nav class="flex-1 p-4 space-y-1">
            <a href="/admin/dashboard/"
                class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800/50 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z">
                    </path>
                </svg>
                Dashboard
            </a>
            <a href="/admin/teachers/"
                class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800/50 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z">
                    </path>
                </svg>
                Manage Teachers
            </a>
            <a href="/admin/students/" class="flex items-center gap-3 px-3 py-2.5 bg-slate-800 text-white rounded-lg">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z">
                    </path>
                </svg>
                Manage Students
            </a>
            <a href="/admin/approvals/"
                class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800/50 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                Result Approvals
            </a>
        </nav>
        <div class="p-4 border-t border-slate-800 mt-auto shrink-0">
            <button id="logoutBtn" type="button"
                class="flex items-center gap-3 w-full px-3 py-2.5 text-slate-400 hover:text-white hover:bg-slate-800/50 rounded-lg transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                    </path>
                </svg>
                Sign Out
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="portal-main flex-1 flex flex-col min-h-0 overflow-y-auto">
        <header
            class="portal-header bg-white border-b border-slate-200 px-4 sm:px-6 lg:px-8 py-4 sm:py-5 flex flex-wrap items-center justify-between gap-3 sticky top-0 z-20 shrink-0">
            <button type="button" id="portalMenuBtn" class="portal-menu-btn" aria-label="Open navigation menu"
                aria-expanded="false" aria-controls="portalSidebar">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
            <div>
                <h1 class="text-xl sm:text-2xl font-bold text-slate-900">Manage Students</h1>
                <p class="text-sm text-slate-500 mt-1">Register students and assign them to classes.</p>
            </div>
            <div class="flex items-center gap-3">
                <button id="bulkUploadBtn"
                    class="inline-flex items-center gap-2 px-4 py-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-sm font-medium rounded-lg transition-colors shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                    </svg>
                    Bulk Upload
                </button>
                <input type="file" id="bulkUploadInput" accept=".xlsx, .xls, .csv" class="hidden" />
                <button id="openModalBtn"
                    class="inline-flex items-center gap-2 px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium rounded-lg transition-colors shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    Add Student
                </button>
            </div>
        </header>

        <div class="portal-content p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto w-full flex-1">
            <!-- Students Table -->
            <div class="portal-table-wrap bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
                <table class="w-full text-left text-sm text-slate-600">
                    <thead class="bg-slate-50 text-slate-900 border-b border-slate-200">
                        <tr>
                            <th class="px-6 py-4 font-semibold">Student Name</th>
                            <th class="px-6 py-4 font-semibold">Admission No.</th>
                            <th class="px-6 py-4 font-semibold">Class</th>
                            <th class="px-6 py-4 font-semibold text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentsTableBody" class="divide-y divide-slate-200">
                        <tr>
                            <td colspan="4" class="px-6 py-8 text-center text-slate-500">Loading students...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal: Add / Edit Student -->
    <div id="studentModal"
        class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden transform scale-95 transition-transform"
            id="modalContent">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                <h3 class="text-lg font-bold text-slate-900" id="modalTitle">Add New Student</h3>
                <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>
            </div>
            <form id="studentForm" class="p-6 space-y-4">
                <input type="hidden" id="editStudentId" />

                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Full Name</label>
                    <input type="text" id="sName" required
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500"
                        placeholder="e.g. John Doe" />
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Admission Number</label>
                    <input type="text" id="sAdmNo" required
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500"
                        placeholder="e.g. GMA1701" />
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Class</label>
                    <input type="text" id="sClass" required
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500"
                        placeholder="e.g. JSS 1" />
                </div>

                <div id="formError"
                    class="hidden p-3 bg-red-50 text-red-600 text-xs rounded-lg border border-red-100 mt-2"></div>

                <div class="pt-2">
                    <button type="submit" id="saveStudentBtn"
                        class="w-full py-2.5 bg-slate-900 text-white font-medium rounded-lg hover:bg-slate-800 transition-colors">Save
                        Student</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="/js/admin/students.js"></script>
    <link rel="stylesheet" href="/assets/powered-by.css" />
    <script type="module" src="/js/shared/poweredBy.js"></script>

    <script type="module" src="/js/shared/portalShell.js"></script>
</body>

</html>
