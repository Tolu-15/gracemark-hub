<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teacher Dashboard — Gracemark Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0f172a;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
    <link rel="stylesheet" href="/assets/portal-layout.css" />
</head>

<body class="bg-slate-50 text-slate-800 portal-app flex h-screen h-[100dvh] overflow-hidden">

    <div id="portalNavBackdrop" class="portal-nav-backdrop" hidden></div>

    <!-- Auth Guard Loader -->
    <div id="authLoader" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center">
        <div class="loader mb-4"></div>
        <p class="text-sm font-medium text-slate-500 animate-pulse">Loading portal...</p>
    </div>

    <!-- Sidebar -->
    <aside id="portalSidebar" class="portal-sidebar w-64 bg-slate-900 text-slate-300 flex flex-col ">
        <div class="p-6 border-b border-slate-800 flex items-center justify-between gap-2">
            <div class="portal-sidebar-brand flex items-center gap-3 min-w-0">
                <div
                    class="w-8 h-8 rounded bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 14l9-5-9-5-9 5 9 5z"></path>
                    </svg>
                </div>
                <h2 class="text-lg font-bold text-white tracking-tight">Teacher <span
                        class="text-xs text-blue-400 align-top">Portal</span></h2>
            </div>
        </div>

        <nav class="flex-1 p-4 space-y-1">
            <a href="/teacher/dashboard/"
                class="flex items-center gap-3 px-3 py-2.5 bg-slate-800 text-white rounded-lg">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
                    </path>
                </svg>
                My Dashboard
            </a>
            <a href="/teacher/score-entry/"
                class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800/50 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                    </path>
                </svg>
                Manage Grades
            </a>
            <a href="/teacher/assessments/"
                class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800/50 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01">
                    </path>
                </svg>
                Manage Assessments
            </a>
            <a href="/teacher/remarks/"
                class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800/50 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z">
                    </path>
                </svg>
                Student Remarks
            </a>
        </nav>

        <div class="p-4 border-t border-slate-800">
            <button id="logoutBtn" type="button"
                class="flex items-center gap-3 w-full px-3 py-2.5 text-slate-400 hover:text-white hover:bg-slate-800/50 rounded-lg transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                    </path>
                </svg>
                Sign Out
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="portal-main flex-1 flex flex-col min-h-0 overflow-y-auto">
        <header
            class="portal-header bg-white border-b border-slate-200 px-4 sm:px-6 lg:px-8 py-4 sm:py-5 flex flex-wrap items-center justify-between gap-3 sticky top-0 z-20 shrink-0">
            <button type="button" id="portalMenuBtn" class="portal-menu-btn" aria-label="Open navigation menu"
                aria-expanded="false" aria-controls="portalSidebar">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
            <div>
                <h1 class="text-xl sm:text-2xl font-bold text-slate-900">Welcome, <span id="teacherName">...</span></h1>
                <p class="text-sm text-slate-500 mt-1">Have a great day teaching!</p>
            </div>
            <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold">
                T
            </div>
        </header>

        <div class="portal-content p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto w-full flex-1">
            <div class="grid grid-cols-1 gap-6 mb-8">
                <!-- Assignment Cards -->
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex items-start gap-4">
                    <div class="p-3 bg-blue-50 rounded-lg text-blue-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4">
                            </path>
                        </svg>
                    </div>
                    <div>
                        <div class="text-sm font-medium text-slate-500 mb-1">Your Class & Subject Assignments</div>
                        <div class="text-xl font-bold text-slate-900 mt-2 flex flex-wrap gap-2" id="displayAssignments">
                            Loading...</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="/js/teacher/dashboard.js"></script>
    <link rel="stylesheet" href="/assets/powered-by.css" />
    <script type="module" src="/js/shared/poweredBy.js"></script>

    <script type="module" src="/js/shared/portalShell.js"></script>
</body>

</html>
