<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Portal — Gracemark Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
        }
    </style>
    <link rel="stylesheet" href="/assets/powered-by.css" />
</head>

<body class="bg-slate-50 text-slate-800 portal-app flex min-h-[100dvh] overflow-hidden">

    <div id="authLoader" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center">
        <p class="text-sm font-medium text-slate-500 animate-pulse">Loading portal...</p>
    </div>

    <aside id="portalSidebar" class="portal-sidebar w-64 bg-slate-900 text-slate-300 flex flex-col ">
        <div class="p-6 border-b border-slate-800 flex items-center justify-between gap-2">
            <div class="portal-sidebar-brand flex items-center gap-3 min-w-0">
                <div
                    class="w-8 h-8 rounded bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center shadow-lg">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 14l9-5-9-5-9 5 9 5z"></path>
                    </svg>
                </div>
                <h2 class="text-lg font-bold text-white tracking-tight">Student <span
                        class="text-xs text-emerald-400 align-top">Portal</span></h2>
            </div>
        </div>
        <nav class="flex-1 p-4 space-y-1">
            <a href="/student/dashboard/"
                class="flex items-center gap-3 px-3 py-2.5 bg-slate-800 text-white rounded-lg">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
                    </path>
                </svg>
                My Overview
            </a>
        </nav>
        <div class="p-4 border-t border-slate-800">
            <button id="logoutBtn"
                class="flex items-center gap-3 w-full px-3 py-2.5 text-slate-400 hover:text-white hover:bg-slate-800/50 rounded-lg transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                    </path>
                </svg>
                Sign Out
            </button>
        </div>
    </aside>

    <main class="portal-main flex-1 flex flex-col min-h-0 overflow-y-auto">
        <header
            class="portal-header bg-white border-b border-slate-200 px-4 sm:px-6 lg:px-8 py-4 sm:py-5 flex flex-wrap items-center justify-between gap-3 sticky top-0 z-20 shrink-0">
            <div>
                <h1 class="text-xl sm:text-2xl font-bold text-slate-900">Welcome, <span id="studentName">...</span> 👋</h1>
                <p class="text-sm text-slate-500 mt-1">
                    Academic session:
                    <span id="displaySession" class="font-semibold text-emerald-700">Loading...</span>
                </p>
            </div>
        </header>

        <div class="portal-content p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto w-full flex-1">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex items-start gap-4">
                    <div class="p-3 bg-emerald-50 rounded-lg text-emerald-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2">
                            </path>
                        </svg>
                    </div>
                    <div>
                        <div class="text-sm font-medium text-slate-500 mb-1">Admission Number</div>
                        <div class="text-xl sm:text-2xl font-bold text-slate-900" id="displayAdmNo">Loading...</div>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex items-start gap-4">
                    <div class="p-3 bg-teal-50 rounded-lg text-teal-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 14l9-5-9-5-9 5 9 5z"></path>
                        </svg>
                    </div>
                    <div>
                        <div class="text-sm font-medium text-slate-500 mb-1">Current Class</div>
                        <div class="text-xl sm:text-2xl font-bold text-slate-900" id="displayClass">Loading...</div>
                    </div>
                </div>
            </div>

            <!-- Results Viewer -->
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                <div class="flex items-center gap-2">
                    <h3 class="text-lg font-semibold text-slate-800">My Approved Results</h3>
                    <span id="resultsCountBadge" class="hidden"></span>
                </div>
                <div class="flex flex-wrap gap-2 items-center">
                    <label class="text-xs text-slate-500 font-medium">Term</label>
                    <select id="termSelect" class="px-3 py-1.5 border border-slate-300 rounded-lg text-sm bg-white"
                        aria-label="Term"></select>
                    <select id="sessionSelect" class="px-3 py-1.5 border border-slate-300 rounded-lg text-sm bg-slate-50 text-slate-700"
                        aria-label="Session" disabled title="Set by school administration"></select>
                    <button id="viewResultsBtn"
                        class="px-4 py-1.5 bg-emerald-600 text-white text-sm font-medium rounded-lg hover:bg-emerald-700">Refresh</button>
                </div>
            </div>

            <!-- Card Grid Container -->
            <div id="resultsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div
                    class="col-span-full p-8 text-center text-slate-500 bg-white border border-slate-200 rounded-xl shadow-sm">
                    Loading your approved results…
                </div>
            </div>
        </div>
    </main>

    <!-- Modal for Score Breakdown -->
    <div id="breakdownModal"
        class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity">
        <div
            class="bg-white rounded-xl shadow-xl w-full max-w-5xl overflow-hidden transform scale-95 transition-transform max-h-[90vh] flex flex-col">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                <h3 class="text-lg font-bold text-slate-900" id="modalTitle">Score Breakdown</h3>
                <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600"><svg class="w-5 h-5" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg></button>
            </div>
            <div class="p-6 overflow-y-auto" id="modalBody"><!-- Content injected by JS --></div>
        </div>
    </div>

    <script type="module" src="/js/student/dashboard.js"></script>
    <script type="module" src="/js/shared/poweredBy.js"></script>

    <link rel="stylesheet" href="/assets/portal-layout.css" />
    <script type="module" src="/js/shared/portalShell.js"></script>
</body>

</html>
