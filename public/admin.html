<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/jpeg" href="/assets/icons/favicon.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Gracemark Academy</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-6">
  <div class="text-center">
    <div class="w-10 h-10 border-2 border-slate-300 border-t-slate-900 rounded-full animate-spin mx-auto mb-4"></div>
    <p class="text-sm text-slate-600">Loading admin portal…</p>
  </div>

  <script type="module">
    import { requireRole } from "/js/shared/guard.js";

    async function init() {
      try {
        const ok = await requireRole("admin", { redirectTo: "/" });
        if (ok) window.location.replace("/admin/dashboard/");
      } catch (error) {
        console.error("Error loading admin portal:", error);
      }
    }
    init();
  </script>
  <link rel="stylesheet" href="/assets/powered-by.css" />
  <script type="module" src="/js/shared/poweredBy.js"></script>
</body>

</html>
